name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # kiwi-fox runs on kiwi-proxy: test against its newest release, which is
      # what kiwi installs beside this one.
      - uses: actions/checkout@v4
        with:
          repository: derlocke-ng/kiwi-proxy
          path: kiwi-proxy
          fetch-depth: 0
      - name: kiwi-proxy at its newest release tag
        working-directory: kiwi-proxy
        run: |
          tag="$(git tag -l | grep -E '^v?[0-9]+(\.[0-9]+){0,3}$' | sort -V | tail -1)"
          git checkout -q "$tag"
          echo "kiwi-proxy $tag"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydantic pytest ruff
      - run: ruff check src tests containers tools && ruff format --check src tests containers tools
      - run: bash -n install.sh
      # test_ui needs GTK 4 and libadwaita; everything else runs headless. The
      # gpg round trips in the engine tests use the runner's gpg.
      - run: python -m pytest tests/unit -q --ignore=tests/unit/test_ui.py
        env:
          KIWI_PROXY_SRC: ${{ github.workspace }}/kiwi-proxy/src

  # The GUI, built for real: GTK 4 and libadwaita from the distribution, under Xvfb.
  # PyGObject comes from the system Python, so this job uses it, not setup-python.
  gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: derlocke-ng/kiwi-proxy
          path: kiwi-proxy
          fetch-depth: 0
      - name: kiwi-proxy at its newest release tag
        working-directory: kiwi-proxy
        run: |
          tag="$(git tag -l | grep -E '^v?[0-9]+(\.[0-9]+){0,3}$' | sort -V | tail -1)"
          git checkout -q "$tag"
      - name: GTK 4, libadwaita, PyGObject, Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
          /usr/bin/python3 -m venv --system-site-packages .venv-gui
          .venv-gui/bin/pip install -q pydantic pytest
      - run: xvfb-run -a .venv-gui/bin/python -m pytest tests/unit/test_ui.py -q
        env:
          KIWI_PROXY_SRC: ${{ github.workspace }}/kiwi-proxy/src
          GSETTINGS_BACKEND: memory
          NO_AT_BRIDGE: "1"

  # The browser image, built from a clean cache and inspected from inside
  # (tests/smoke/browser-image.sh). 0.3.1's Containerfile failed on Fedora 43
  # over a renamed font package, and nothing before a desktop build noticed:
  # the unit tests never touch the Containerfile.
  browser-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in tests/smoke/browser-image.sh containers/browser/entrypoint.sh; do bash -n "$f"; done
      - name: build, without a cache that could hide a broken step
        run: podman build --no-cache -t kiwi-fox/browser:smoke -f containers/browser/Containerfile containers/browser
      - name: what the build must have produced
        run: bash tests/smoke/browser-image.sh kiwi-fox/browser:smoke
